<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Rounding List</title>
<meta name="theme-color" content="#0f6e56" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Rounding" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app" class="app"></div>

<!-- Toast -->
<div id="toast" class="toast" hidden></div>

<!-- Update modal -->
<div id="update-modal" class="overlay" hidden>
  <div class="sheet">
    <h2>A new version of the app is available.</h2>
    <div class="version-row">
      <span>Current version</span>
      <strong id="current-version-label">0.0.0</strong>
    </div>
    <div class="version-row">
      <span>New version</span>
      <strong id="new-version-label">0.0.0</strong>
    </div>
    <div id="update-notes" class="update-notes"></div>
    <div class="sheet-actions">
      <button id="update-later" class="btn-secondary">Later</button>
      <button id="update-now" class="btn-primary">Update now</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
