<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Rounding List</title>
<meta name="theme-color" content="#0f6e56" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Rounding" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<style>
:root {
  --accent: #0f6e56;
  --accent-bg: #e1f5ee;
  --accent-text: #085041;
  --danger: #d85a30;
  --danger-bg: #faece7;
  --danger-text: #712b13;
  --warn: #ba7517;
  --warn-bg: #faeeda;
  --warn-text: #633806;
  --success: #3b6d11;
  --success-bg: #eaf3de;
  --success-text: #27500a;

  --info: #2f6fae;
  --info-bg: #e3eef8;
  --info-text: #1d4f7a;

  --bg: #f4f3ef;
  --surface: #ffffff;
  --surface-2: #f0efe9;
  --text: #1c1c1a;
  --text-secondary: #5f5e5a;
  --text-muted: #8a8880;
  --border: #e3e1d9;
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --accent: #4fbf9a;
    --accent-bg: #10352c;
    --accent-text: #9fe1cb;
    --info: #6badf0;
    --info-bg: #142c40;
    --info-text: #a9d1f7;
    --bg: #16171a;
    --surface: #1f2124;
    --surface-2: #26282c;
    --text: #f2f1ec;
    --text-secondary: #b5b3aa;
    --text-muted: #83817a;
    --border: #33352f;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  height: 100%;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 84px;
  padding-top: env(safe-area-inset-top);
}

button { font-family: inherit; cursor: pointer; }

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px;
}
.header-title { font-size: 17px; font-weight: 600; }
.header-sub { font-size: 12px; color: var(--text-secondary); }
.icon-btn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
  color: var(--text); flex-shrink: 0;
}
.icon-btn svg { width: 18px; height: 18px; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Progress + sort */
.progress-wrap { display: flex; align-items: center; gap: 10px; padding: 2px 16px 12px; }
.progress-bars { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.progress-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); }
.progress-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.progress-dot.rounded { background: var(--success); }
.progress-dot.notes { background: var(--info); }
.progress-label { white-space: nowrap; flex-shrink: 0; }
.progress-bar-track { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.progress-fill { height: 100%; }
.progress-fill.rounded-fill { background: var(--success); }
.progress-fill.notes-fill { background: var(--info); }
.sort-btn {
  font-size: 12px; padding: 6px 10px; border-radius: 20px; background: var(--surface);
  border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap;
  display: flex; align-items: center; gap: 5px; flex-shrink: 0;
}
.sort-btn svg { width: 13px; height: 13px; }
.sort-icon-btn {
  width: 34px; height: 34px; border-radius: 9px; background: var(--surface); border: 1px solid var(--border);
  color: var(--text-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sort-icon-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); }
.sort-icon-btn svg { width: 17px; height: 17px; }

/* Cards */
.list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.card.done { opacity: 0.6; }
.card-face { padding: 12px 12px 10px; }
.card-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.room-label { font-size: 18px; font-weight: 700; }
.problem-banner {
  font-size: 14px; font-weight: 600; color: var(--danger-text); background: var(--danger-bg);
  border-radius: 9px; padding: 7px 10px; margin-top: 6px; display: block;
}
.problem-banner.empty { color: var(--text-muted); background: var(--surface-2); font-weight: 500; }
.chev { color: var(--text-muted); flex-shrink: 0; }
.chev svg { width: 18px; height: 18px; }

.big-toggles { display: flex; gap: 8px; margin-top: 10px; }
.big-toggle {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 6px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--text-secondary);
}
.big-toggle svg { width: 18px; height: 18px; }
.big-toggle.on { background: var(--success-bg); border-color: var(--success); color: var(--success-text); }

.timestamp-line { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }

.face-bottom-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 8px; }
.todo-summary-chip {
  font-size: 12px; color: var(--text-secondary); background: var(--surface-2);
  border-radius: 20px; padding: 5px 10px; display: flex; align-items: center; gap: 5px;
}
.timer-mini {
  display: flex; align-items: center; gap: 6px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 20px; padding: 5px 6px 5px 10px;
}
.timer-mini-display { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
.timer-mini-btn {
  width: 30px; height: 30px; border-radius: 50%; border: none;
  display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff;
}
.timer-mini-btn.running { background: var(--danger); }
.timer-mini-btn svg { width: 14px; height: 14px; }

.icon-only-btn { background: none; border: none; color: var(--text-muted); display: flex; align-items: center; }
.icon-only-btn svg { width: 19px; height: 19px; }

/* Expand panel */
.expand-panel { max-height: 0; overflow: hidden; transition: max-height 0.28s ease; }
.expand-panel.open { max-height: 2000px; }
.expand-inner { padding: 0 12px 12px; border-top: 1px solid var(--border); }
.expand-section { padding-top: 10px; }
.expand-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; }

.todo-item { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 14px; }
.todo-item input[type=checkbox] { width: 19px; height: 19px; flex-shrink: 0; }
.todo-item.checked span { color: var(--text-muted); text-decoration: line-through; }
.todo-add { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); background: none; border: none; padding: 6px 0; font-weight: 600; }
.todo-add svg { width: 15px; height: 15px; }

.notes-block textarea { width: 100%; min-height: 70px; resize: none; overflow: hidden; }
.notes-actions { display: flex; gap: 8px; margin-top: 8px; }

/* Tab bar */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border);
  display: flex; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto;
}
.tabbar-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-muted); font-size: 11px; }
.tabbar-item.active { color: var(--accent); }
.tabbar-item svg { width: 22px; height: 22px; }

/* Overlay / sheet / modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
.overlay[hidden] { display: none; }
.overlay.center { align-items: center; padding: 20px; }
.sheet {
  width: 100%; max-width: 480px; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto;
}
.overlay.center .sheet { border-radius: 16px; max-height: 80vh; }
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 12px; }
.sheet h2 { font-size: 16px; margin: 0 0 12px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
textarea, input[type=text], input[type=date], select {
  width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  font-size: 14px; background: var(--surface-2); color: var(--text); font-family: inherit;
}
textarea { resize: vertical; min-height: 90px; }
.btn-primary, .btn-secondary { flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; border: 1px solid var(--border); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-secondary { background: var(--surface); color: var(--text); }
.btn-block { width: 100%; margin-top: 10px; }
.dictate-btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.dictate-btn.recording { background: var(--danger-bg); border-color: var(--danger); color: var(--danger-text); }

.version-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; color: var(--text-secondary); }
.update-notes { font-size: 13px; color: var(--text-secondary); margin-top: 8px; white-space: pre-line; }

/* Splash / launch screen */
.splash { padding: 60px 24px 24px; text-align: center; }
.splash h1 { font-size: 20px; margin-bottom: 4px; }
.splash p { font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
.resume-card { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 16px; text-align: left; margin-bottom: 16px; }
.unit-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; margin: 10px 0; }
.unit-bed { background: var(--surface-2); border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; }

/* Dispo tab */
.dispo-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.dispo-card.pending { border-color: var(--warn); }
.dispo-face { padding: 12px; }
.dispo-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dispo-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
.badge.today { background: var(--danger-bg); color: var(--danger-text); }
.badge.soon { background: var(--warn-bg); color: var(--warn-text); }
.badge.later { background: var(--surface-2); color: var(--text-secondary); }
.badge.pending { background: var(--warn-bg); color: var(--warn-text); }
.badge.none { background: var(--surface-2); color: var(--text-muted); }

.field-row { margin-top: 10px; }
.field-row label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; display: block; margin-bottom: 4px; }
.date-preview { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.date-preview strong { color: var(--text); }

.moist-row { display: flex; gap: 6px; margin-top: 6px; }
.moist-chip {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 2px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface-2);
}
.moist-chip.on { background: var(--success-bg); border-color: var(--success); }
.moist-chip .letter { font-size: 16px; font-weight: 700; }
.moist-chip .label { font-size: 9px; color: var(--text-secondary); text-align: center; line-height: 1.2; }
.moist-chip input { width: 15px; height: 15px; }

.pending-reason { font-size: 12px; color: var(--warn-text); margin-top: 6px; }

.dispo-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
.dispo-item input[type=checkbox] { width: 16px; height: 16px; }
.dispo-item.checked span { color: var(--text-muted); text-decoration: line-through; }
.dispo-subitem { margin-left: 24px; font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.dispo-subitem input { width: 15px; height: 15px; }
.dispo-add { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-top: 4px; background: none; border: none; padding: 4px 0; }

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  font-size: 13px; padding: 9px 16px; border-radius: 20px; z-index: 60; max-width: 90%; text-align: center;
}

.footer-version { text-align: center; font-size: 11px; color: var(--text-muted); padding: 14px 0 6px; }
.footer-version button { background: none; border: none; color: var(--text-muted); font-size: 11px; text-decoration: underline; }

.section-title { font-size: 13px; font-weight: 600; margin: 4px 16px 8px; }
.empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 16px; }

.menu-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 6px; font-size: 14px;
  background: none; border: none; width: 100%; text-align: left; color: var(--text);
}
.menu-item.danger { color: var(--danger-text); }
.menu-item svg { width: 18px; height: 18px; color: var(--text-secondary); }
.menu-item .hint { margin-left: auto; font-size: 11px; color: var(--text-muted); }

/* Dispo status icon */
.dispo-status-icon {
  width: 34px; height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 15px; font-weight: 600;
}
.dispo-status-icon svg { width: 30px; height: 30px; overflow: visible; }
.dispo-status-icon.sleeping svg { color: var(--text-muted); }
.dispo-status-icon.ready svg { color: var(--success); animation: bounceJump 0.7s ease-in-out infinite; }
.dispo-status-icon.waiting svg { color: var(--warn); }
.dispo-status-icon .zzz { animation: floatZ 2.2s ease-in-out infinite; }
.dispo-status-icon .zzz2 { animation: floatZ 2.2s ease-in-out infinite; animation-delay: 0.7s; }
.dispo-status-icon .foot { animation: waitTap 0.8s ease-in-out infinite; transform-origin: 8px 16px; }

@keyframes bounceJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes floatZ { 0%, 55%, 100% { opacity: 0; transform: translateY(2px); } 25% { opacity: 1; transform: translateY(-2px); } }
@keyframes waitTap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }

.dispo-face-row { display: flex; gap: 10px; align-items: flex-start; }
.dispo-face-main { flex: 1; min-width: 0; }

/* Minimal share link */
.share-link-row { text-align: center; padding: 6px 16px 4px; }
.share-link {
  background: none; border: none; color: var(--text-secondary); font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px; padding: 6px;
}
.share-link svg { width: 14px; height: 14px; }

/* Priority picker (add to-do modal) */
.priority-picker { display: flex; gap: 8px; margin-top: 4px; }
.priority-opt {
  flex: 1; padding: 10px 4px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--surface-2); font-size: 13px; font-weight: 700; text-align: center; color: var(--text-secondary);
}
.priority-opt.selected.high { background: var(--danger-bg); border-color: var(--danger); color: var(--danger-text); }
.priority-opt.selected.medium { background: var(--warn-bg); border-color: var(--warn); color: var(--warn-text); }
.priority-opt.selected.low { background: var(--success-bg); border-color: var(--success); color: var(--success-text); }

.todo-priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.todo-priority-dot.high { background: var(--danger); }
.todo-priority-dot.medium { background: var(--warn); }
.todo-priority-dot.low { background: var(--success); }

/* Reminders tab summary */
.reminders-summary { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin: 0 16px 12px; }
.summary-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.priority-summary-row { display: flex; gap: 8px; margin-top: 10px; }
.priority-chip { flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 6px 4px; border-radius: 10px; }
.priority-chip.high { background: var(--danger-bg); color: var(--danger-text); }
.priority-chip.medium { background: var(--warn-bg); color: var(--warn-text); }
.priority-chip.low { background: var(--success-bg); color: var(--success-text); }

/* Reminders tab */
.reminder-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.reminder-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.reminder-card-head .room-label { font-size: 15px; }

</style>
</head>
<body>

<div id="app" class="app"></div>

<div id="toast" class="toast" hidden></div>

<div id="update-modal" class="overlay" hidden>
  <div class="sheet">
    <h2>A new version of the app is available.</h2>
    <div class="version-row"><span>Current version</span><strong id="current-version-label">0.0.0</strong></div>
    <div class="version-row"><span>New version</span><strong id="new-version-label">0.0.0</strong></div>
    <div id="update-notes" class="update-notes"></div>
    <div class="sheet-actions">
      <button id="update-later" class="btn-secondary">Later</button>
      <button id="update-now" class="btn-primary">Update now</button>
    </div>
  </div>
</div>

<script>

    sunrise: '<path d="M12 2v4"/><path d="M4.9 6.9l2.8 2.8"/><path d="M19.1 6.9l-2.8 2.8"/><path d="M2 17h20"/><path d="M5 21h14"/><path d="M12 9a5 5 0 0 0-5 5h10a5 5 0 0 0-5-5z"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    calendarOff: '<rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="14" x2="17" y2="20"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
    arrows: '<path d="M8 3L4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/>',
    calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01"/>'
  };
  function icon(name) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] || ""}</svg>`;
  }

  /* ---------------------------- Dispo status icon (person, animated) ---------------------------- */
  function renderStatusIcon(p) {
    if (!p.edd.date) return `<div class="dispo-status-icon">&ndash;</div>`;
    if (p.pending.active) {
      return `<div class="dispo-status-icon waiting" aria-label="Waiting on something">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="10" cy="5" r="3"/>
          <rect x="7" y="9" width="6" height="7" rx="1"/>
          <rect x="14" y="12" width="5" height="6" rx="1"/>
          <rect class="foot" x="7" y="16" width="3" height="5"/>
          <rect x="11" y="16" width="3" height="5"/>
        </svg>
      </div>`;
    }
    if (diffDays(p.edd.date) <= 0) {
      return `<div class="dispo-status-icon ready" aria-label="Ready for discharge">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="3"/>
          <rect x="9" y="9" width="6" height="8" rx="1"/>
          <rect x="4" y="8" width="4" height="2" transform="rotate(-20 6 9)"/>
          <rect x="16" y="8" width="4" height="2" transform="rotate(20 18 9)"/>
          <rect x="8" y="18" width="3" height="4"/>
          <rect x="13" y="18" width="3" height="4"/>
        </svg>
      </div>`;
    }
    return `<div class="dispo-status-icon sleeping" aria-label="Not yet ready">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="14" width="14" height="4" rx="1"/>
        <circle cx="18" cy="14" r="3"/>
        <text class="zzz" x="13" y="9" font-size="6">z</text>
        <text class="zzz2" x="17" y="5" font-size="4">z</text>
      </svg>
    </div>`;
  }

  /* ---------------------------- Unit database ---------------------------- */
  const UNITS = [
    { name: "Galter 4 Observation Unit", from: 472, to: 484 },
    { name: "Custom / manual entry", from: null, to: null }
  ];

  const PTOT_OPTIONS = ["", "Home", "Home with services", "Acute rehab", "SNF", "LTACH", "Hospice", "Other"];

  /* ---------------------------- Date helpers ---------------------------- */
  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function addDaysISO(iso, n) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    dt.setDate(dt.getDate() + n);
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
  }
  function diffDays(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const target = new Date(y, m - 1, d);
    const [ty, tm, td] = todayISO().split("-").map(Number);
    const now = new Date(ty, tm - 1, td);
    return Math.round((target - now) / 86400000);
  }
  function prettyDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function eddLabel(iso) {
    if (!iso) return "Not set";
    const diff = diffDays(iso);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff > 1) return `In ${diff} days`;
    return `Overdue \u2014 was ${prettyDate(iso)}`;
  }
  function eddBadgeClass(iso) {
    if (!iso) return "none";
    const diff = diffDays(iso);
    if (diff <= 0) return "today";
    if (diff <= 3) return "soon";
    return "later";
  }

  /* ---------------------------- State ---------------------------- */
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function defaultState() {
    return {
      week: { active: false, unitName: "", startDate: null, dayIndex: 1 },
      patients: [],
      ui: { tab: "rounds", screen: "splash", sortMode: "room", dispoSortMode: "room" }
    };
  }

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const merged = Object.assign(defaultState(), parsed);
      merged.ui = Object.assign(defaultState().ui, parsed.ui || {});
      merged.patients = (merged.patients || []).map(migratePatient);
      return merged;
    } catch (e) {
      return defaultState();
    }
  }
  function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function migratePatient(p) {
    return Object.assign(newPatient(p.room), p, {
      todos: p.todos || [],
      dispo: p.dispo || [],
      edd: p.edd || { option: null, date: null },
      ptot: p.ptot || { rec: "", dateRecommended: null },
      pending: p.pending || { active: false, reason: "" },
      moist: p.moist || { med: false, order: false, instructions: false, summary: false, time: false }
    });
  }

  function fmtTime(ts) {
    if (!ts) return "";
    return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  function fmtClock(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, "0");
    const s = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function newPatient(room) {
    return {
      id: uid(), room, problem: "",
      roundedAt: null, noteAt: null,
      todos: [],
      dispo: [],
      edd: { option: null, date: null },
      ptot: { rec: "", dateRecommended: null },
      pending: { active: false, reason: "" },
      moist: { med: false, order: false, instructions: false, summary: false, time: false },
      notesText: "",
      timerSessions: [], timerRunningStart: null,
      _expanded: false, _dispoExpanded: false
    };
  }

  /* ---------------------------- Toast ---------------------------- */
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
  }

  /* ---------------------------- Version footer ---------------------------- */
  let displayedVersion = "0.2.0";
  function versionFooter() {
    return `<div class="footer-version"><button data-action="open-changelog">Version ${displayedVersion}</button></div>`;
  }

  /* ---------------------------- Render: root ---------------------------- */
  function render() {
    const app = document.getElementById("app");
    if (state.ui.screen === "splash") {
      app.innerHTML = renderSplash();
    } else if (state.ui.tab === "dispo") {
      app.innerHTML = renderHeader() + renderDispoTab() + versionFooter() + renderTabbar();
    } else if (state.ui.tab === "reminders") {
      app.innerHTML = renderHeader() + renderRemindersTab() + versionFooter() + renderTabbar();
    } else {
      app.innerHTML = renderHeader() + renderProgress() + renderRoundsList() + versionFooter() + renderTabbar();
      document.querySelectorAll('textarea[data-role="notes-textarea"]').forEach(autoResizeTextarea);
    }
  }

  /* ---------------------------- Splash / launch screen ---------------------------- */
  function renderSplash() {
    let unitOptions = UNITS.map(u => `<option value="${u.name}">${u.name}</option>`).join("");
    let resumeBlock = "";
    if (state.week.active && state.patients.length) {
      resumeBlock = `
        <div class="resume-card">
          <div style="font-weight:600; font-size:14px; margin-bottom:4px;">Resume rounding week</div>
          <div style="font-size:12px; color:var(--text-secondary); margin-bottom:10px;">${state.week.unitName || "Custom list"} &middot; Day ${state.week.dayIndex} &middot; ${state.patients.length} beds</div>
          <button class="btn-primary btn-block" data-action="resume-week">Resume Day ${state.week.dayIndex}</button>
        </div>`;
    }
    return `
      <div class="splash">
        <h1>Rounding List</h1>
        <p>No names, no PHI beyond room numbers &mdash; everything stays on this device.</p>
        ${resumeBlock}
        <div class="resume-card" style="border-color:var(--border);">
          <div style="font-weight:600; font-size:14px; margin-bottom:8px;">Start a new rounding week</div>
          <select id="unit-select">${unitOptions}</select>
          <div id="unit-preview"></div>
          <button class="btn-primary btn-block" data-action="start-week">Load beds &amp; start week</button>
          <div style="text-align:center; margin-top:8px;">
            <button data-action="manual-week" style="background:none;border:none;color:var(--accent);font-size:12px;">Or select individual rooms manually</button>
          </div>
        </div>
      </div>`;
  }

  function unitPreview(name) {
    const unit = UNITS.find(u => u.name === name);
    const preview = document.getElementById("unit-preview");
    if (!preview) return;
    if (!unit || unit.from == null) {
      preview.innerHTML = `<div style="font-size:12px; color:var(--text-secondary); margin:8px 0;">You'll add rooms one at a time on the next screen.</div>`;
      return;
    }
    const beds = [];
    for (let r = unit.from; r <= unit.to; r++) beds.push(r);
    preview.innerHTML = `
      <div style="font-size:12px; color:var(--text-secondary); margin:8px 0 4px;">${beds.length} beds &middot; rooms ${unit.from}&ndash;${unit.to}</div>
      <div class="unit-grid">${beds.slice(0, 8).map(b => `<div class="unit-bed">${b}</div>`).join("")}${beds.length > 8 ? '<div class="unit-bed">&hellip;</div>' : ""}</div>`;
  }

  /* ---------------------------- Header ---------------------------- */
  function renderHeader() {
    const titles = { rounds: "Rounding Week", dispo: "Disposition Overview & Discharge Planning", reminders: "Reminders" };
    let sub;
    if (state.ui.tab === "rounds") sub = `${escapeHtml(state.week.unitName || "Custom list")} &middot; Day ${state.week.dayIndex}`;
    else sub = `${state.patients.length} beds`;

    const dispoSortBtn = state.ui.tab === "dispo"
      ? `<button class="sort-icon-btn ${state.ui.dispoSortMode === "edd" ? "active" : ""}" data-action="toggle-dispo-sort" aria-label="Sort by estimated discharge date">${icon("calendar")}</button>`
      : "";

    return `
      <div class="header">
        <div style="flex:1; min-width:0;">
          <div class="header-title" style="${state.ui.tab === "dispo" ? "font-size:15px; line-height:1.3;" : ""}">${titles[state.ui.tab]}</div>
          <div class="header-sub">${sub}</div>
        </div>
        <div class="header-actions">
          ${dispoSortBtn}
          <button class="icon-btn" data-action="open-menu" aria-label="Menu">${icon("dots")}</button>
        </div>
      </div>`;
  }

  /* ---------------------------- Progress + sort ---------------------------- */
  function renderProgress() {
    const total = state.patients.length || 1;
    const rounded = state.patients.filter(p => p.roundedAt).length;
    const notes = state.patients.filter(p => p.noteAt).length;
    const roundedPct = Math.round((rounded / total) * 100);
    const notesPct = Math.round((notes / total) * 100);
    const sortLabel = state.ui.sortMode === "room" ? "Room order" : "By progress";
    return `
      <div class="progress-wrap">
        <div class="progress-bars">
          <div class="progress-row">
            <span class="progress-dot rounded"></span>
            <span class="progress-label">${rounded}/${state.patients.length} rounded</span>
            <div class="progress-bar-track"><div class="progress-fill rounded-fill" style="width:${roundedPct}%"></div></div>
          </div>
          <div class="progress-row">
            <span class="progress-dot notes"></span>
            <span class="progress-label">${notes}/${state.patients.length} notes</span>
            <div class="progress-bar-track"><div class="progress-fill notes-fill" style="width:${notesPct}%"></div></div>
          </div>
        </div>
        <button class="sort-btn" data-action="toggle-sort">${icon("arrows")} ${sortLabel}</button>
      </div>`;
  }

  /* ---------------------------- Rounds list ---------------------------- */
  function sortedPatients() {
    const list = [...state.patients];
    if (state.ui.sortMode === "progress") {
      list.sort((a, b) => {
        const score = p => (p.roundedAt ? 1 : 0) + (p.noteAt ? 1 : 0);
        return score(a) - score(b) || a.room.localeCompare(b.room, undefined, { numeric: true });
      });
    } else {
      list.sort((a, b) => a.room.localeCompare(b.room, undefined, { numeric: true }));
    }
    return list;
  }

  function renderRoundsList() {
    if (!state.patients.length) {
      return `<div class="empty-state">No beds loaded. Open the menu to edit your bed list.</div>`;
    }
    return `<div class="list">${sortedPatients().map(renderCard).join("")}</div>`;
  }

  function renderCard(p) {
    const done = p.roundedAt && p.noteAt;
    const openTodos = p.todos.filter(t => !t.checked).length;
    const running = !!p.timerRunningStart;
    const totalSeconds = timerTotalSeconds(p) + (running ? (Date.now() - p.timerRunningStart) / 1000 : 0);

    return `
    <div class="card ${done ? "done" : ""}" data-pid="${p.id}">
      <div class="card-face" data-action="toggle-expand" data-pid="${p.id}">
        <div class="card-top-row">
          <span class="room-label">Room ${escapeHtml(p.room)}</span>
          <span class="chev">${icon(p._expanded ? "chevUp" : "chevDown")}</span>
        </div>
        ${p.problem
          ? `<span class="problem-banner" data-action="edit-problem" data-pid="${p.id}">${escapeHtml(p.problem)}</span>`
          : `<button class="problem-banner empty" data-action="edit-problem" data-pid="${p.id}">Tap to add primary problem</button>`}

        <div class="big-toggles">
          <button class="big-toggle ${p.roundedAt ? "on" : ""}" data-action="toggle-rounded" data-pid="${p.id}">${icon("stethoscope")} Rounded</button>
          <button class="big-toggle ${p.noteAt ? "on" : ""}" data-action="toggle-note" data-pid="${p.id}">${icon("fileText")} Note done</button>
        </div>
        <div class="timestamp-line">${p.roundedAt ? "Rounded " + fmtTime(p.roundedAt) : "Not yet rounded"}${p.noteAt ? " &middot; note " + fmtTime(p.noteAt) : ""}</div>

        <div class="face-bottom-row">
          <span class="todo-summary-chip">${icon("list")} ${openTodos} open to-do${openTodos === 1 ? "" : "s"}</span>
          <div class="timer-mini">
            <span class="timer-mini-display" data-role="timer-display" data-pid="${p.id}">${fmtClock(totalSeconds)}</span>
            <button class="timer-mini-btn ${running ? "running" : ""}" data-action="toggle-timer" data-pid="${p.id}" aria-label="Start or stop timer">${icon(running ? "pause" : "play")}</button>
          </div>
        </div>
      </div>

      <div class="expand-panel ${p._expanded ? "open" : ""}">
        <div class="expand-inner">
          <div class="expand-section">
            <div class="expand-label">To-dos &amp; reminders</div>
            ${renderTodoList(p)}
            <button class="todo-add" data-action="add-todo" data-pid="${p.id}">${icon("plus")} Add to-do / reminder</button>
          </div>
          <div class="expand-section notes-block">
            <div class="expand-label">Notes</div>
            <textarea data-role="notes-textarea" data-pid="${p.id}" placeholder="e.g. patient complained of chest pain overnight...">${escapeHtml(p.notesText)}</textarea>
            <div class="notes-actions" style="justify-content:flex-end;">
              <button class="icon-only-btn" data-action="open-bed-options" data-pid="${p.id}" aria-label="Bed options" style="flex:0 0 auto; padding:0 10px;">${icon("trash")}</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function renderTodoList(p) {
    if (!p.todos.length) return `<div style="font-size:13px; color:var(--text-muted);">Nothing yet</div>`;
    return p.todos.map(t => `
      <div class="todo-item ${t.checked ? "checked" : ""}">
        ${t.priority ? `<span class="todo-priority-dot ${t.priority}"></span>` : ""}
        <input type="checkbox" data-action="toggle-todo" data-pid="${p.id}" data-tid="${t.id}" ${t.checked ? "checked" : ""}/>
        <span data-action="edit-todo" data-pid="${p.id}" data-tid="${t.id}">${escapeHtml(t.text)}</span>
      </div>`).join("");
  }

  function timerTotalSeconds(p) {
    return p.timerSessions.reduce((sum, s) => sum + (s.end - s.start) / 1000, 0);
  }

  /* ---------------------------- Reminders tab ---------------------------- */
  function renderRemindersTab() {
    if (!state.patients.length) return `<div class="empty-state">No beds loaded yet.</div>`;
    const allTodos = state.patients.flatMap(p => p.todos);
    const completed = allTodos.filter(t => t.checked).length;
    const total = allTodos.length;
    const pct = total ? Math.round((completed / total) * 100) : 0;
    const openOf = pr => allTodos.filter(t => !t.checked && t.priority === pr).length;

    const summary = `
      <div class="reminders-summary">
        <div class="summary-row"><span>Tasks completed today</span><span>${completed}/${total}</span></div>
        <div class="progress-bar-track"><div class="progress-fill" style="width:${pct}%; background:var(--accent);"></div></div>
        <div class="priority-summary-row">
          <span class="priority-chip high">${openOf("high")} High</span>
          <span class="priority-chip medium">${openOf("medium")} Medium</span>
          <span class="priority-chip low">${openOf("low")} Low</span>
        </div>
      </div>`;

    const list = [...state.patients].sort((a, b) => a.room.localeCompare(b.room, undefined, { numeric: true }));
    const cards = list.map(p => `
      <div class="reminder-card">
        <div class="reminder-card-head">
          <span class="room-label">Room ${escapeHtml(p.room)}</span>
          <button class="icon-btn" style="width:30px;height:30px;" data-action="add-todo" data-pid="${p.id}">${icon("plus")}</button>
        </div>
        ${p.problem ? `<div style="font-size:12px; color:var(--text-secondary); margin-bottom:6px;">${escapeHtml(p.problem)}</div>` : ""}
        ${renderTodoList(p)}
      </div>`).join("");
    return summary + `<div class="list">${cards}</div>`;
  }

  /* ---------------------------- Dispo tab ---------------------------- */
  function renderDispoTab() {
    if (!state.patients.length) return `<div class="empty-state">No beds loaded yet.</div>`;
    const sorted = [...state.patients].sort((a, b) => {
      if (state.ui.dispoSortMode === "edd") {
        const da = a.edd.date ? diffDays(a.edd.date) : 9999;
        const db = b.edd.date ? diffDays(b.edd.date) : 9999;
        return da - db || a.room.localeCompare(b.room, undefined, { numeric: true });
      }
      return a.room.localeCompare(b.room, undefined, { numeric: true });
    });
    const cards = sorted.map(renderDispoCard).join("");
    return `<div class="list">${cards}</div>
      <div class="share-link-row">
        <button class="share-link" data-action="share-summary">${icon("share")} Share sign-out summary</button>
      </div>`;
  }

  function renderDispoCard(p) {
    const label = eddLabel(p.edd.date);
    const badgeClass = eddBadgeClass(p.edd.date);
    const isTodayOrOverdue = p.edd.date && diffDays(p.edd.date) <= 0;
    const dispoItems = p.dispo.map(d => `
      <div class="dispo-item ${d.checked ? "checked" : ""}">
        <input type="checkbox" data-action="toggle-dispo" data-pid="${p.id}" data-did="${d.id}" ${d.checked ? "checked" : ""}/>
        <span data-action="edit-dispo" data-pid="${p.id}" data-did="${d.id}">${escapeHtml(d.text)}</span>
      </div>
      ${d.isConsult && d.checked ? `
      <div class="dispo-subitem">
        <input type="checkbox" data-action="toggle-recs" data-pid="${p.id}" data-did="${d.id}" ${d.recsChecked ? "checked" : ""}/>
        <span>Recs followed?</span>
      </div>` : ""}
    `).join("");

    return `
    <div class="dispo-card ${p.pending.active ? "pending" : ""}">
      <div class="dispo-face" data-action="toggle-dispo-expand" data-pid="${p.id}">
        <div class="dispo-face-row">
          ${renderStatusIcon(p)}
          <div class="dispo-face-main">
            <div class="dispo-top-row">
              <span class="room-label">Room ${escapeHtml(p.room)}</span>
              <span class="chev">${icon(p._dispoExpanded ? "chevUp" : "chevDown")}</span>
            </div>
            ${p.problem ? `<div style="font-size:13px; color:var(--text-secondary); margin-top:4px;">${escapeHtml(p.problem)}</div>` : ""}
            <div class="dispo-badges">
              <span class="badge ${badgeClass}">EDD: ${label}</span>
              ${p.ptot.rec ? `<span class="badge later">${escapeHtml(p.ptot.rec)}</span>` : ""}
              ${p.pending.active ? `<span class="badge pending">Pending${p.pending.reason ? ": " + escapeHtml(p.pending.reason) : ""}</span>` : ""}
            </div>
          </div>
        </div>
      </div>

      <div class="expand-panel ${p._dispoExpanded ? "open" : ""}">
        <div class="expand-inner">

          <div class="field-row">
            <label>Estimated discharge date</label>
            <select data-action="set-edd-option" data-pid="${p.id}">
              <option value="">Not set</option>
              <option value="today" ${p.edd.option === "today" ? "selected" : ""}>Today</option>
              <option value="tomorrow" ${p.edd.option === "tomorrow" ? "selected" : ""}>Tomorrow</option>
              <option value="2-3" ${p.edd.option === "2-3" ? "selected" : ""}>2&ndash;3 days</option>
              <option value="3-5" ${p.edd.option === "3-5" ? "selected" : ""}>3&ndash;5 days</option>
              <option value="custom" ${p.edd.option === "custom" ? "selected" : ""}>Pick a date&hellip;</option>
            </select>
            ${p.edd.option === "custom" ? `<input type="date" style="margin-top:6px;" data-action="set-edd-custom" data-pid="${p.id}" value="${p.edd.date || ""}" />` : ""}
            ${p.edd.date ? `<div class="date-preview">Resolves to <strong>${prettyDate(p.edd.date)}</strong> &middot; ${label}</div>` : ""}
          </div>

          ${isTodayOrOverdue ? `
          <div class="field-row">
            <label>Discharge checklist &mdash; M.O.I.S.T.</label>
            <div class="moist-row">
              ${moistChip(p, "med", "M", "Meds")}
              ${moistChip(p, "order", "O", "Order")}
              ${moistChip(p, "instructions", "I", "Instr.")}
              ${moistChip(p, "summary", "S", "Summary")}
              ${moistChip(p, "time", "T", "Time")}
            </div>
          </div>` : ""}

          <div class="field-row">
            <label>PT/OT recommendation</label>
            <select data-action="set-ptot" data-pid="${p.id}">
              ${PTOT_OPTIONS.map(o => `<option value="${o}" ${p.ptot.rec === o ? "selected" : ""}>${o || "Not set"}</option>`).join("")}
            </select>
            ${p.ptot.dateRecommended ? `<div class="date-preview">Recommended ${prettyDate(p.ptot.dateRecommended)}</div>` : ""}
          </div>

          <div class="field-row">
            <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-weight:600; font-size:13px;">
              <input type="checkbox" style="width:17px;height:17px;" data-action="toggle-pending" data-pid="${p.id}" ${p.pending.active ? "checked" : ""}/>
              Awaiting something (pending discharge)
            </label>
            ${p.pending.active && p.pending.reason ? `<div class="pending-reason">${escapeHtml(p.pending.reason)}</div>` : ""}
          </div>

          <div class="field-row">
            <label>Other dispo items</label>
            ${dispoItems || '<div style="font-size:12px; color:var(--text-muted);">No items yet</div>'}
            <button class="dispo-add" data-action="add-dispo" data-pid="${p.id}">${icon("plus")} Add item</button>
          </div>

        </div>
      </div>
    </div>`;
  }

  function moistChip(p, key, letter, label) {
    const on = p.moist[key];
    return `
      <label class="moist-chip ${on ? "on" : ""}">
        <span class="letter">${letter}</span>
        <span class="label">${label}</span>
        <input type="checkbox" data-action="toggle-moist" data-pid="${p.id}" data-key="${key}" ${on ? "checked" : ""}/>
      </label>`;
  }

  /* ---------------------------- Tab bar ---------------------------- */
  function renderTabbar() {
    return `
      <div class="tabbar">
        <button class="tabbar-item ${state.ui.tab === "rounds" ? "active" : ""}" data-action="set-tab" data-tab="rounds">${icon("list")}<span>Rounds</span></button>
        <button class="tabbar-item ${state.ui.tab === "dispo" ? "active" : ""}" data-action="set-tab" data-tab="dispo">${icon("door")}<span>Dispo</span></button>
        <button class="tabbar-item ${state.ui.tab === "reminders" ? "active" : ""}" data-action="set-tab" data-tab="reminders">${icon("bell")}<span>Reminders</span></button>
        <button class="tabbar-item" data-action="open-menu">${icon("dots")}<span>More</span></button>
      </div>`;
  }

  /* ---------------------------- Menu sheet ---------------------------- */
  function openMenuSheet() {
    const overlay = createOverlay(false);
    overlay.querySelector(".sheet").innerHTML = `
      <div class="sheet-handle"></div>
      <h2>Menu</h2>
      <button class="menu-item" data-action="new-day">${icon("sunrise")} Start new day <span class="hint">clears daily checks</span></button>
      <button class="menu-item" data-action="edit-beds">${icon("edit")} Edit bed list</button>
      <button class="menu-item" data-action="open-changelog">${icon("fileText")} Version ${displayedVersion} &amp; changelog</button>
      <button class="menu-item danger" data-action="end-week">${icon("calendarOff")} End rounding week <span class="hint">clears roster</span></button>
      <div class="sheet-actions"><button class="btn-secondary" data-action="close-overlay">Close</button></div>
    `;
  }

  /* ---------------------------- Add to-do modal ---------------------------- */
  function openAddTodoModal(pid) {
    const overlay = createOverlay(false);
    const sheet = overlay.querySelector(".sheet");
    sheet.dataset.priority = "";
    sheet.dataset.pid = pid;
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <h2>Add to-do / reminder</h2>
      <div class="priority-picker">
        <button type="button" class="priority-opt high" data-action="pick-priority" data-priority="high">High</button>
        <button type="button" class="priority-opt medium" data-action="pick-priority" data-priority="medium">Medium</button>
        <button type="button" class="priority-opt low" data-action="pick-priority" data-priority="low">Low</button>
      </div>
      <input type="text" id="todo-text-input" placeholder="To-Do/Reminder" style="margin-top:10px;" />
      <div class="sheet-actions">
        <button class="btn-secondary" data-action="close-overlay">Cancel</button>
        <button class="btn-primary" data-action="submit-todo">Add</button>
      </div>
    `;
    setTimeout(() => { const el = document.getElementById("todo-text-input"); if (el) el.focus(); }, 50);
  }

  /* ---------------------------- Bed options (delete / clear) ---------------------------- */
  function openBedOptionsSheet(pid) {
    const p = state.patients.find(x => x.id === pid);
    if (!p) return;
    const overlay = createOverlay(false);
    overlay.querySelector(".sheet").innerHTML = `
      <div class="sheet-handle"></div>
      <h2>Room ${escapeHtml(p.room)}</h2>
      <button class="menu-item" data-action="clear-bed" data-pid="${pid}" style="color:var(--info-text);">${icon("sunrise")} Clear <span class="hint">reset for a new patient</span></button>
      <button class="menu-item danger" data-action="delete-bed" data-pid="${pid}">${icon("trash")} Delete <span class="hint">remove this bed</span></button>
      <div class="sheet-actions"><button class="btn-secondary" data-action="close-overlay">Cancel</button></div>
    `;
  }

  /* ---------------------------- Changelog modal ---------------------------- */
  function openChangelogModal() {
    const overlay = createOverlay(true);
    overlay.querySelector(".sheet").innerHTML = `<div style="text-align:center; padding:20px;">Loading changelog&hellip;</div>`;
    fetch("./CHANGELOG.md", { cache: "no-store" })
      .then(r => r.text())
      .then(text => {
        overlay.querySelector(".sheet").innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
            <h2 style="margin:0;">Changelog</h2>
            <button data-action="close-overlay" aria-label="Close">${icon("x")}</button>
          </div>
          <div style="font-size:13px; color:var(--text-secondary); white-space:pre-wrap; line-height:1.6;">${escapeHtml(text)}</div>
        `;
      })
      .catch(() => {
        overlay.querySelector(".sheet").innerHTML = `<div style="text-align:center; padding:20px;">Couldn't load changelog offline.</div>`;
      });
  }

  /* ---------------------------- Overlay helper ---------------------------- */
  function createOverlay(centered) {
    const overlay = document.createElement("div");
    overlay.className = "overlay" + (centered ? " center" : "");
    overlay.innerHTML = `<div class="sheet"></div>`;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeOverlay(overlay); });
    document.body.appendChild(overlay);
    return overlay;
  }
  function closeOverlay(el) { el.remove(); }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------------------------- Actions ---------------------------- */
  function handlePatientMutation(pid, mutate, skipRender) {
    const p = state.patients.find(x => x.id === pid);
    if (!p) return;
    mutate(p);
    saveState();
    if (!skipRender) render();
  }

  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    const pid = target.dataset.pid;

    switch (action) {
      case "resume-week":
        state.ui.screen = "app"; saveState(); render();
        break;

      case "manual-week": {
        state.week = { active: true, unitName: "Custom / manual entry", startDate: new Date().toISOString(), dayIndex: 1 };
        state.patients = [];
        state.ui.screen = "app";
        saveState(); render();
        break;
      }

      case "start-week": {
        const sel = document.getElementById("unit-select");
        const unitName = sel ? sel.value : UNITS[0].name;
        const unit = UNITS.find(u => u.name === unitName);
        const patients = [];
        if (unit && unit.from != null) for (let r = unit.from; r <= unit.to; r++) patients.push(newPatient(String(r)));
        state.week = { active: true, unitName, startDate: new Date().toISOString(), dayIndex: 1 };
        state.patients = patients;
        state.ui.screen = "app";
        saveState(); render();
        toast(`${patients.length} beds loaded`);
        break;
      }

      case "set-tab":
        state.ui.tab = target.dataset.tab; saveState(); render();
        break;

      case "toggle-sort":
        state.ui.sortMode = state.ui.sortMode === "room" ? "progress" : "room";
        saveState(); render();
        break;

      case "toggle-dispo-sort":
        state.ui.dispoSortMode = state.ui.dispoSortMode === "room" ? "edd" : "room";
        saveState(); render();
        break;

      case "open-menu": openMenuSheet(); break;
      case "close-overlay": closeOverlay(target.closest(".overlay")); break;

      case "new-day":
        state.patients.forEach(p => { p.roundedAt = null; p.noteAt = null; });
        state.week.dayIndex += 1;
        saveState(); closeOverlay(target.closest(".overlay")); render();
        toast("New day started \u2014 daily checks cleared");
        break;

      case "end-week":
        if (confirm("End this rounding week? This clears your bed list, notes, and dispo history for these beds.")) {
          state = defaultState();
          state.ui.screen = "splash";
          saveState(); closeOverlay(target.closest(".overlay")); render();
        }
        break;

      case "edit-beds": {
        const roomsCsv = prompt("Edit room list, comma separated:", state.patients.map(p => p.room).join(", "));
        if (roomsCsv !== null) {
          const rooms = roomsCsv.split(",").map(r => r.trim()).filter(Boolean);
          const existing = {};
          state.patients.forEach(p => existing[p.room] = p);
          state.patients = rooms.map(r => existing[r] || newPatient(r));
          saveState();
        }
        closeOverlay(target.closest(".overlay")); render();
        break;
      }

      case "open-changelog": openChangelogModal(); break;

      case "toggle-rounded":
        handlePatientMutation(pid, p => { p.roundedAt = p.roundedAt ? null : Date.now(); });
        break;
      case "toggle-note":
        handlePatientMutation(pid, p => { p.noteAt = p.noteAt ? null : Date.now(); });
        break;

      case "toggle-expand": {
        const p = state.patients.find(x => x.id === pid);
        if (p) { p._expanded = !p._expanded; render(); }
        break;
      }
      case "toggle-dispo-expand": {
        const p = state.patients.find(x => x.id === pid);
        if (p) { p._dispoExpanded = !p._dispoExpanded; render(); }
        break;
      }

      case "edit-problem": {
        const p = state.patients.find(x => x.id === pid);
        const val = prompt("Primary problem / one-liner:", p ? p.problem : "");
        if (val !== null) handlePatientMutation(pid, p => { p.problem = val.trim(); });
        break;
      }

      case "add-todo":
        openAddTodoModal(pid);
        break;

      case "pick-priority": {
        const sheet = target.closest(".sheet");
        sheet.dataset.priority = target.dataset.priority;
        sheet.querySelectorAll(".priority-opt").forEach(b => b.classList.remove("selected"));
        target.classList.add("selected");
        break;
      }
      case "submit-todo": {
        const sheet = target.closest(".sheet");
        const todoPid = sheet.dataset.pid;
        const input = document.getElementById("todo-text-input");
        const text = input.value.trim();
        if (!text) { toast("Enter a to-do first"); break; }
        const priority = sheet.dataset.priority || null;
        handlePatientMutation(todoPid, p => { p.todos.push({ id: uid(), text, checked: false, priority, createdAt: Date.now() }); p._expanded = true; });
        closeOverlay(target.closest(".overlay"));
        break;
      }
      case "edit-todo": {
        const tid = target.dataset.tid;
        const p = state.patients.find(x => x.id === pid);
        const item = p && p.todos.find(t => t.id === tid);
        if (!item) break;
        const val = prompt("Edit item:", item.text);
        if (val !== null) handlePatientMutation(pid, p => { p.todos.find(t => t.id === tid).text = val.trim(); });
        break;
      }
      case "toggle-todo": {
        const tid = target.dataset.tid;
        handlePatientMutation(pid, p => { const t = p.todos.find(x => x.id === tid); t.checked = !t.checked; });
        break;
      }

      case "toggle-timer": {
        handlePatientMutation(pid, p => {
          if (p.timerRunningStart) {
            p.timerSessions.push({ start: p.timerRunningStart, end: Date.now() });
            p.timerRunningStart = null;
          } else {
            p.timerRunningStart = Date.now();
          }
        });
        break;
      }

      case "open-bed-options":
        openBedOptionsSheet(pid);
        break;

      case "delete-bed": {
        const p = state.patients.find(x => x.id === pid);
        if (p && confirm(`Delete Room ${p.room}? This permanently removes this bed from your list.`)) {
          state.patients = state.patients.filter(x => x.id !== pid);
          saveState();
          closeOverlay(target.closest(".overlay"));
          render();
        }
        break;
      }
      case "clear-bed": {
        const p = state.patients.find(x => x.id === pid);
        if (p && confirm(`Clear Room ${p.room} for a new patient? This resets rounding status, to-dos, notes, the timer, and all dispo info for this bed.`)) {
          const fresh = newPatient(p.room);
          fresh.id = p.id;
          Object.assign(p, fresh);
          saveState();
          closeOverlay(target.closest(".overlay"));
          render();
          toast(`Room ${p.room} cleared`);
        }
        break;
      }

      case "set-edd-custom": break; // handled on change event

      case "toggle-dispo": {
        const did = target.dataset.did;
        handlePatientMutation(pid, p => { const it = p.dispo.find(d => d.id === did); it.checked = !it.checked; p._dispoExpanded = true; });
        break;
      }
      case "toggle-recs": {
        const did = target.dataset.did;
        handlePatientMutation(pid, p => { const it = p.dispo.find(d => d.id === did); it.recsChecked = !it.recsChecked; p._dispoExpanded = true; });
        break;
      }
      case "edit-dispo": {
        const did = target.dataset.did;
        const p = state.patients.find(x => x.id === pid);
        const item = p && p.dispo.find(d => d.id === did);
        if (!item) break;
        const val = prompt("Edit item:", item.text);
        if (val !== null) handlePatientMutation(pid, p => {
          const it = p.dispo.find(d => d.id === did);
          it.text = val.trim(); it.isConsult = /consult/i.test(val); p._dispoExpanded = true;
        });
        break;
      }
      case "add-dispo": {
        const text = prompt("Dispo item (e.g. needs Cardiology follow up):");
        if (text) {
          const isConsult = /consult/i.test(text);
          handlePatientMutation(pid, p => { p.dispo.push({ id: uid(), text, checked: false, isConsult, recsChecked: false }); p._dispoExpanded = true; });
        }
        break;
      }

      case "toggle-moist": {
        const key = target.dataset.key;
        handlePatientMutation(pid, p => { p.moist[key] = !p.moist[key]; p._dispoExpanded = true; });
        break;
      }

      case "toggle-pending": {
        const p = state.patients.find(x => x.id === pid);
        if (!p) break;
        if (!p.pending.active) {
          const reason = prompt("What are you waiting on? (e.g. awaiting CT results)") || "";
          handlePatientMutation(pid, p => { p.pending = { active: true, reason: reason.trim() }; p._dispoExpanded = true; });
        } else {
          handlePatientMutation(pid, p => { p.pending = { active: false, reason: "" }; p._dispoExpanded = true; });
        }
        break;
      }

      case "share-summary": {
        const lines = state.patients.map(p => {
          const pending = p.todos.filter(t => !t.checked).map(t => `  - ${t.text}`).join("\n");
          return `Room ${p.room}${p.edd.date ? " (EDD " + eddLabel(p.edd.date) + ")" : ""}${p.pending.active ? " \u2014 PENDING: " + p.pending.reason : ""}\n${pending || "  - no open to-dos"}`;
        }).join("\n\n");
        const text = `Sign-out summary \u2014 ${state.week.unitName || "Rounding list"}\n\n${lines}`;
        if (navigator.share) navigator.share({ text }).catch(() => {});
        else if (navigator.clipboard) { navigator.clipboard.writeText(text); toast("Summary copied to clipboard"); }
        break;
      }
    }
  });

  document.addEventListener("change", (e) => {
    if (e.target.id === "unit-select") unitPreview(e.target.value);

    if (e.target.dataset.action === "set-edd-option") {
      const pid = e.target.dataset.pid;
      const val = e.target.value;
      handlePatientMutation(pid, p => {
        let date = null;
        if (val === "today") date = todayISO();
        else if (val === "tomorrow") date = addDaysISO(todayISO(), 1);
        else if (val === "2-3") date = addDaysISO(todayISO(), 2);
        else if (val === "3-5") date = addDaysISO(todayISO(), 3);
        else if (val === "custom") date = p.edd.date || todayISO();
        p.edd = { option: val || null, date };
        p._dispoExpanded = true;
      });
    }
    if (e.target.dataset.action === "set-edd-custom") {
      const pid = e.target.dataset.pid;
      const val = e.target.value;
      handlePatientMutation(pid, p => { p.edd.date = val; p._dispoExpanded = true; });
    }
    if (e.target.dataset.action === "set-ptot") {
      const pid = e.target.dataset.pid;
      const val = e.target.value;
      handlePatientMutation(pid, p => {
        p.ptot.rec = val;
        p.ptot.dateRecommended = val ? todayISO() : null;
        p._dispoExpanded = true;
      });
    }
  });

  function autoResizeTextarea(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  document.addEventListener("input", (e) => {
    if (e.target.dataset && e.target.dataset.role === "notes-textarea") {
      const pid = e.target.dataset.pid;
      autoResizeTextarea(e.target);
      handlePatientMutation(pid, p => { p.notesText = e.target.value; }, true);
    }
  });

  /* ---------------------------- Timer tick ---------------------------- */
  setInterval(() => {
    document.querySelectorAll('[data-role="timer-display"]').forEach(el => {
      const p = state.patients.find(x => x.id === el.dataset.pid);
      if (!p || !p.timerRunningStart) return;
      const total = timerTotalSeconds(p) + (Date.now() - p.timerRunningStart) / 1000;
      el.textContent = fmtClock(total);
    });
  }, 1000);

  /* ---------------------------- Launch flow ---------------------------- */
  function initLaunch() {
    const fresh = !sessionStorage.getItem("sessionActive");
    sessionStorage.setItem("sessionActive", "1");
    state.ui.screen = fresh ? "splash" : (state.week.active ? "app" : "splash");
  }

  /* ---------------------------- Version + service worker ---------------------------- */
  function loadVersionAndStart() {
    fetch(APP_VERSION_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => { displayedVersion = data.version || displayedVersion; })
      .catch(() => {})
      .finally(() => { initLaunch(); render(); });
  }

  function initServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").then(reg => {
        reg.update();
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;
          if (!newWorker) return;
          newWorker.addEventListener("statechange", () => {
            if (newWorker.state === "installed" && navigator.serviceWorker.controller) showUpdateModal(reg);
          });
        });
      }).catch(() => {});

      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }

  function showUpdateModal(reg) {
    fetch(APP_VERSION_URL, { cache: "no-store" })
      .then(r => r.json())
      .then(data => {
        document.getElementById("current-version-label").textContent = displayedVersion;
        document.getElementById("new-version-label").textContent = data.version;
        document.getElementById("update-notes").innerHTML = (data.notes || []).map(n => `\u2022 ${escapeHtml(n)}`).join("<br>");
        const modal = document.getElementById("update-modal");
        modal.hidden = false;
        document.getElementById("update-now").onclick = () => {
          toast("Downloading update\u2026");
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          setTimeout(() => toast("Update complete. Restarting\u2026"), 400);
        };
        document.getElementById("update-later").onclick = () => { modal.hidden = true; };
      })
      .catch(() => {});
  }

  loadVersionAndStart();
  initServiceWorker();
})();

</script>
</body>
</html>
